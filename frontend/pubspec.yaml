name: travel_frontend_v1
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  app_links: ^7.2.2
  dio: ^5.11.1
  firebase_app_installations: ^0.4.4
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  geolocator: ^14.1.1
  go_router: ^17.5.0
  google_maps_flutter: ^2.18.1
  google_mlkit_text_recognition: ^0.17.1
  google_sign_in: ^7.2.0
  image_picker: ^1.2.3
  json_annotation: ^4.12.0
  mime: ^2.1.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.3
  socket_io_client: ^3.1.6
  timezone: ^0.10.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  build_runner: ^2.16.2
  flutter_driver:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
