services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: travel-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: phantien
      POSTGRES_PASSWORD: tien1234
      POSTGRES_DB: travel_db
    ports:
      - "5555:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis_container
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  ollama:
    image: ollama/ollama:latest
    container_name: travel-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  redis_data:
  ollama_data:
